name: bhaktimart_ui
description: "Bhaktimart's UI library."
version: 1.0.2
homepage: https://github.com/Bhaktimart-shop/bhaktimart_ui
publish_to: none

environment:
  sdk: ^3.8.1
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  calendar_date_picker2: ^2.0.1
  focusable_control_builder: ^1.1.0
  vector_graphics: ^1.1.19
  gap: ^3.0.1
  pinput: ^5.0.1
  flutter_switch: ^0.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  vector_graphics_compiler: ^1.1.18

flutter_gen:
  output: lib/assets/
  fonts:
    enabled: false

flutter:
  uses-material-design: true
  generate: true
  assets:
    - path: assets/
      transformers:
        - package: vector_graphics_compiler

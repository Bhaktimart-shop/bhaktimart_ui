name: widgetbook_workspace
description: "Bhaktimart Group UI library Widgetbook for Flutter"
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.8.0

dependencies:
  bhaktimart_ui:
    path: ../
  flutter:
    sdk: flutter
  widgetbook: ^3.10.2
  widgetbook_annotation: ^3.2.0

dev_dependencies:
  build_runner: ^2.4.14
  flutter_gen_runner: ^5.8.0
  flutter_test:
    sdk: flutter
  vector_graphics_compiler: ^1.1.16
  widgetbook_generator: ^3.9.1

flutter_gen:
  output: lib/assets/
  fonts:
    enabled: false

flutter:
  uses-material-design: true
  assets:
    - path: assets/vector/
      transformers:
        - package: vector_graphics_compiler
